[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-research-skill"
version = "2.0.0"
description = "Dynamic context-driven scientific literature research pipeline"
requires-python = ">=3.12"
dependencies = [
    "habanero",
    "orjson",
    "fastembed>=0.8.0",
    "symspellpy",
    "pyalex",
    "semanticscholar",
    "arxiv",
    "numpy",
    "scipy",
    "scikit-learn",
    "httpx",
    "pypdf",
    "matplotlib",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.16.3",
    "pyright==1.1.411",
]

[tool.setuptools.packages.find]
include = ["research_core*", "scripts*"]
exclude = ["tests*"]
