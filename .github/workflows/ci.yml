name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff==0.16.3 pyright==1.1.411

      - name: Validate packaging metadata
        run: python -m pip check

      - name: Run configured Ruff defect checks
        run: ruff check scripts tests --output-format=github

      - name: Run offline test suite
        env:
          SCIENTIFIC_RESEARCH_NO_SKILL_VENV: "1"
          SCIENTIFIC_RESEARCH_NO_BOOTSTRAP: "1"
        run: python -m pytest tests -m "not live" -q
