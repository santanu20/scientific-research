name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install habanero pyalex semanticscholar arxiv numpy scipy \
            scikit-learn httpx pypdf orjson fastembed networkx matplotlib \
            pytest

      - name: Run test suite
        env:
          SCIENTIFIC_RESEARCH_NO_SKILL_VENV: "1"
        run: python -m pytest tests -m "not live" -q
